syntax = "proto3";
package test;
option cc_generic_services = true;

message person {
  string name = 1;
  int32 age = 2;
  string email = 3;
  repeated float score = 4;
  map<int32, string> other = 5;
}

message HelloRequest {
    string id = 1;
}

message HelloResponse {
  string str = 1;
}

service Greeter {
  rpc SayHellow (HelloRequest) returns (HelloResponse) {};
}
